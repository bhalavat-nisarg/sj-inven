name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npx ng run app:ionic-cordova-build --cordova-mock --cordova-assets=false
      - run: npm run build -- --configuration production --progress=false
      - run: npm test -- --watch=false --browsers=ChromiumHeadless --progress=false
      - run: npm run e2e